
[settings]
# whether to prompt to install plugins and runtimes if they're not already installed
# missing_runtime_behavior = 'autoinstall' # other options: 'ignore', 'warn', 'prompt', 'autoinstall'

# plugins can read the versions files used by other version managers (if enabled by the plugin)
# for example, .nvmrc in the case of nodejs's nvm
legacy_version_file = true # enabled by default (different than asdf)

# configure `mise install` to always keep the downloaded archive
always_keep_download = false # deleted after install by default
always_keep_install = false  # deleted on failure by default
all_compile = false # use precompiled binaries if available, otherwise compile from source. This is the default behavior.
# configure how frequently (in minutes) to fetch updated plugin repository changes
# this is updated whenever a new runtime is installed
# (note: this isn't currently implemented but there are plans to add it: https://github.com/jdxcode/rtx/issues/128)
plugin_autoupdate_last_check_duration = '1 week' # set to 0 to disable updates
verbose = false # set to true to see full installation output, see `RTX_VERBOSE`
asdf_compat = false # set to true to ensure .tool-versions will be compatible with asdf, see `RTX_ASDF_COMPAT`
jobs = 8 # number of plugins or runtimes to install in parallel. The default is `8`.
raw = false # set to true to directly pipe plugins to stdin/stdout/stderr
experimental = true
idiomatic_version_file_enable_tools = [
  "node",
  "python",
  "pnpm",
  "npm",
  "bun",
  "deno",
  "yarn",
]
python.compile = false # always download precompiled binaries
color_theme = "catppuccin"
pipx.uvx = true
gpg_verify = true
npm.package_manager = "pnpm"
http_retries = 5
locked = true
minimum_release_age = "2d"  # override for this tool only
# shims_dir = '~/.local/share/rtx/shims' # [experimental] directory where shims are stored

[tools]
go = "latest"
rust = "latest"
ruby = "latest"
uv = "latest"
pnpm = "latest"
node = ["lts", "latest"]
usage = "latest"
deno = {version = "latest", lazy=true}
ruff = "latest"
gallery-dl = {version = "latest", lazy=true}
cargo-binstall = "latest"
prek = "latest"
gum = {version = "latest", lazy=true} #  is installed only when one of its commands is first called
grex = {version = "latest", lazy=true}
nub = { version = "latest", allow_builds = ["@nubjs/nub"] }
typos = "latest"
claude = {version = "latest", lazy=true}


